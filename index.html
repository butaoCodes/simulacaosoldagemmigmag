<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Soldagem MIG/MAG</title>
<style>
:root{color-scheme:dark;--bg:#1a2027;--pn:#232b34;--ln:#36414d;--tx:#e9edf1;--mu:#9fabb8;--ac:#ff9a2e;--ok:#4cc38a;--wn:#f2c14e;--bd:#f0645f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;padding:16px 16px 0;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}h1 b{color:var(--ac)}
h2{margin:18px 0 8px;font-size:1rem;font-weight:600}
#proc{color:var(--mu);font-size:.9rem}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#0b0e12}
#sec{max-width:340px;border:1px solid var(--ln)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--mu)}button.pri{background:var(--ac);border-color:var(--ac);color:#1a1208;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8cc2ff;outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
.cd span{display:block;color:var(--mu);font-size:.8rem}.cd b{font-size:1.15rem;font-weight:600}
#dg{margin-top:12px;display:grid;gap:6px}
#dg div{padding:8px 10px;border-radius:8px;background:var(--pn);border-left:4px solid var(--mu)}
#dg .ok{border-color:var(--ok)}#dg .wn{border-color:var(--wn)}#dg .bd{border-color:var(--bd)}

.sl{margin:10px 0}.sl div{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}.sl em{font-style:normal;color:var(--tx);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac)}
label.s{display:block;margin:10px 0;color:var(--mu);font-size:.9rem}

#sw{position:relative}
#v3w{position:absolute;top:8px;right:8px;width:32%;min-width:230px;background:rgba(11,14,18,.84);border:1px solid var(--ln);border-radius:10px;padding:6px}

.vb{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}
.vb button{padding:3px 8px;font-size:.78rem;border-radius:6px}
.vb button.on{background:var(--ac);border-color:var(--ac);color:#1a1208}
@media(max-width:600px){#v3w{width:56%;min-width:0}#v3w.big{width:94%}}
#v3w.big{width:66%}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><h1>Simulador de soldagem <b>MIG/MAG</b></h1><span id="proc"></span></header>
<main>
<section>
<label class="s" style="margin:0">Peça a soldar<select id="pc"></select></label><p id="pd" style="color:var(--mu);font-size:.85rem;margin:4px 0 10px"></p>
<canvas id="sim" width="900" height="520" aria-label="Simulação do processo de soldagem"></canvas>
<div class="bar"><button id="go" class="pri">Soldar</button><button id="rs">Reiniciar</button><button id="id">Ajuste ideal</button></div>
<div class="cards" id="cards"></div>
<div id="dg" aria-live="polite"></div>
</section>
<aside>
<h2>Parâmetros</h2><div id="ctl"></div>
<label class="s">Gás de proteção<select id="g"><option value="mix">Ar + 18% CO₂ (MAG)</option><option value="co2">CO₂ 100% (MAG)</option><option value="ar">Argônio 100% (MIG)</option></select></label>
<label class="s">Diâmetro do arame<select id="d"><option value="0.8">0,8 mm</option><option value="1" selected>1,0 mm</option><option value="1.2">1,2 mm</option></select></label>
<h2>Seção transversal do cordão</h2><canvas id="sec" width="320" height="280"></canvas>
<small>Modelo didático simplificado, com valores aproximados para estudo. Não substitui a EPS (especificação do procedimento de soldagem).</small>
</aside>
</main>
<script>
const $=i=>document.getElementById(i),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),f=(n,d=1)=>n.toFixed(d).replace('.',',');
const S={v:22,wfs:6,tr:6,so:15,gas:15,ang:10,d:1,g:'mix',pc:'flat'};
const PC={flat:{n:'Chapa de 8 mm (cordão sobre chapa)',T:8,k:'flat',d:'Chapa plana para treinar arco, velocidade e altura do cordão.',i:{wfs:6,tr:6}},
thin:{n:'Chapa fina de 3 mm',T:3,k:'flat',d:'Pouca massa: energia demais fura a chapa.',i:{wfs:4.5,tr:6}},
butt:{n:'Junta de topo, chapas de 5 mm',T:5,k:'butt',d:'Duas chapas com 2 mm de abertura. Exige penetração total na raiz, sem furar.',i:{wfs:7,tr:4.5}},
tee:{n:'Junta em T (filete), chapas de 8 mm',T:8,k:'tee',d:'Filete entre a alma e a base. A perna mínima é de 5 mm.',i:{wfs:7,tr:5.5}},
lap:{n:'Junta sobreposta, chapas de 6 mm',T:6,k:'lap',d:'Filete na borda da chapa superior. A perna mínima é de 4 mm.',i:{wfs:6,tr:6}}};
const CFG=[['v','Tensão','V',14,36,.5],['wfs','Velocidade do arame','m/min',2,16,.1],['tr','Velocidade de avanço','mm/s',2,12,.5],['so','Stick-out','mm',8,25,1],['gas','Vazão do gás','L/min',6,25,1],['ang','Ângulo da tocha (+ empurrar, − arrastar)','°',-20,30,1]];
const fm=(k,v)=>k==='ang'&&v>0?'+'+v:f(+v,k==='v'||k==='wfs'||k==='tr'?1:0);
CFG.forEach(([k,l,u,mn,mx,st])=>{const e=document.createElement('div');e.className='sl';
e.innerHTML=`<div><span>${l}</span><span><em id="e_${k}"></em> ${u}</span></div><input type="range" id="r_${k}" min="${mn}" max="${mx}" step="${st}" aria-label="${l}">`;
$('ctl').appendChild(e);$('r_'+k).oninput=ev=>{S[k]=+ev.target.value;ui()}});
function sync(){CFG.forEach(([k])=>{$('r_'+k).value=S[k];$('e_'+k).textContent=fm(k,S[k])})}
$('g').onchange=e=>{S.g=e.target.value;ui()};
$('pc').innerHTML=Object.entries(PC).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');$('pc').onchange=e=>{S.pc=e.target.value;reset();ui()};$('d').onchange=e=>{S.d=+e.target.value;ui()};

function calc(){
 const a={0.8:20,1:25,1.2:31}[S.d];
 const I=(a*S.wfs+20)*(1-(S.so-15)*0.01),Vo=14+0.05*I,dV=S.v-Vo;
 const spray=dV>-1&&((S.g==='ar'&&I>200)||(S.g==='mix'&&I>240));
 const mode=spray?'Spray':(I<(S.g==='co2'?220:200)&&dV<2.5)?'Curto-circuito':'Globular';
 const heat=S.v*I*0.8/(S.tr*1000),A=Math.PI*S.d*S.d/4*(S.wfs*1000/60)/S.tr;
 const gf={mix:1,co2:1.15,ar:0.85}[S.g];
 const J=PC[S.pc],T=J.T,K=J.k,p=cl(I/55*gf*(1-S.ang*0.012)*cl(1+(5-S.tr)*0.05,0.6,1.4)*(K==='butt'?1.4:1),0,12);
 const w0=Math.sqrt(A)*cl(1.9+dV*0.12,1.3,2.8)*(1+S.ang*0.008),fl=K==='tee'||K==='lap',z=Math.sqrt(2*A/1.1),gA=K==='butt'?2*T:0,w=fl?z:w0;
 const ei=A-gA<.5,h=fl?z*.75:cl((A-gA)/(0.66*w),0.2,6);
 const sp=cl({mix:.15,co2:.4,ar:.1}[S.g]+Math.abs(dV)*0.05+(mode==='Globular'?0.25:0)+(mode==='Curto-circuito'?0.05:0),0,1);
 return{I,Vo,dV,mode,heat,A,p,w,h,sp,uc:dV>3.5||(S.tr>9&&I>200),lf:(K==='butt'?p<.85*T:p<1.5)||heat<.25,pr:S.gas<10?.2:(S.gas>20||S.so>22)?.04:0,bt:p>=T*(K==='butt'?1.35:1),ox:S.gas<10,un:(S.g==='ar'?1:0)+(dV<-4?.5:0),z,ei,T,K,fl};
}
function dg(c){const r=[],P=(l,t)=>r.push([l,t]);
 if(c.lf)P('bd',c.K==='butt'?'Falta de penetração na raiz: a junta não fundiu por inteiro.':'Falta de fusão: pouca penetração ou energia.');
 if(c.bt)P('bd',c.K==='butt'?'Perfuração: o arco rompeu a raiz da junta.':'Perfuração da chapa de '+c.T+' mm.');else if(c.K!=='butt'&&c.p>.75*c.T)P('wn','Penetração elevada: perto de furar a chapa.');
 if(c.ei)P('bd','Enchimento insuficiente: o metal não preencheu a abertura.');else if(c.fl){const mn=c.K==='tee'?5:4;if(c.z<mn)P('wn','Perna do filete abaixo do mínimo ('+mn+' mm).');else if(c.z>9)P('wn','Filete grande demais: excesso de metal e distorção.')}else if(c.h>3.5)P('wn','Reforço excessivo (cordão convexo).');
 if(!c.fl&&!c.ei&&c.h<0.8)P('wn','Cordão muito baixo: pouco metal depositado.');
 if(c.dV>3.5||(S.tr>9&&c.I>200))P('wn','Risco de mordedura (undercut).');
 if(c.dV<-4)P('wn','Tensão baixa: arco curto, cordão estreito e alto.');
 if(c.sp>.6)P('bd','Respingos excessivos.');else if(c.sp>.35)P('wn','Respingos moderados.');
 if(S.gas<10)P('bd','Porosidade: vazão de gás insuficiente.');
 else if(S.gas>20)P('wn','Vazão alta: a turbulência pode aspirar ar.');
 if(S.so>22)P('wn','Stick-out longo: proteção e arco instáveis.');
 if(S.so<10)P('wn','Stick-out curto: risco de queimar o bico de contato.');
 if(S.g==='ar')P('wn','Argônio puro em aço: arco instável. Use Ar + CO₂.');
 if(!r.length)P('ok','Parâmetros equilibrados: cordão de boa qualidade.');
 return r}
const NAMES=['Corrente','Calor aportado','Transferência','Largura','Reforço','Penetração','Respingos'];
$('cards').innerHTML=NAMES.map((n,i)=>`<div class="cd"><span id="n${i}">${n}</span><b id="c${i}"></b></div>`).join('');
let C=calc();
function ui(){C=calc();sync();
 const v=[f(C.I,0)+' A',f(C.heat,2)+' kJ/mm',C.mode,f(C.w)+' mm',f(C.fl?C.z*.707:C.h)+' mm',f(C.p)+' mm',C.sp<.25?'Baixo':C.sp<.5?'Médio':'Alto'];
 v.forEach((t,i)=>$('c'+i).textContent=t);$('n3').textContent=C.fl?'Perna do filete':'Largura';$('n4').textContent=C.fl?'Garganta':'Reforço';$('pd').textContent=PC[S.pc].d;
 $('dg').innerHTML=dg(C).map(([l,t])=>`<div class="${l}">${t}</div>`).join('');
 $('proc').textContent=(S.g==='ar'?'MIG':'MAG')+' · '+{mix:'Ar + 18% CO₂',co2:'CO₂ 100%',ar:'Argônio 100%'}[S.g]+' · arame de '+f(S.d)+' mm';
 sec()}
function sec(){const k=$('sec').getContext('2d'),m=15,y0=70,x=160,c=C;
 const p=Math.min(c.p,8),w=Math.min(c.w,19),h=Math.min(c.h,4.6);
 k.clearRect(0,0,320,230);k.fillStyle='#4a525d';k.fillRect(0,y0,320,120);
 k.save();k.beginPath();k.rect(0,y0,320,120);k.clip();
 k.fillStyle='rgba(224,160,90,.3)';k.beginPath();k.ellipse(x,y0,(w/2+2.5)*m,(p+2.5)*m,0,0,Math.PI);k.fill();
 k.fillStyle='#dcd6c8';k.beginPath();k.ellipse(x,y0,w/2*m*.95,p*m,0,0,Math.PI);k.fill();k.restore();
 k.beginPath();k.moveTo(x-w/2*m,y0);k.quadraticCurveTo(x,y0-2*h*m,x+w/2*m,y0);k.closePath();k.fill();
 k.fillStyle='#10141a';
 if(c.pr)for(let i=0;i<5;i++){k.beginPath();k.arc(x+(i-2)*w*m*.16,y0+(i%2?.35:.2)*p*m+4,2+i%3,0,7);k.fill()}
 if(c.uc)for(const s of[-1,1]){k.beginPath();k.moveTo(x+s*w/2*m,y0);k.lineTo(x+s*(w/2*m+9),y0);k.lineTo(x+s*(w/2*m+2),y0+8);k.fill()}
 if(c.lf){k.strokeStyle='#10141a';k.lineWidth=2;for(const s of[-1,1]){k.beginPath();k.moveTo(x+s*w/2*m,y0);k.lineTo(x+s*w/2*m*.85,y0+p*m*.9);k.stroke()}}
 if(c.bt){k.fillStyle='#0b0e12';k.fillRect(x-9,y0,18,120)}
 k.fillStyle='#e9edf1';k.font='12px system-ui,sans-serif';
 k.fillText('Chapa de 8 mm · fundo: zona fundida (clara) e ZTA (alaranjada)',8,205,304);
 k.fillText('L '+f(c.w)+' mm   R '+f(c.h)+' mm   P '+f(c.p)+' mm',8,222);
 if(c.p>=8){k.fillStyle='#f0645f';k.font='bold 14px system-ui,sans-serif';k.fillText('Perfuração',x-36,150)}}

function sec(){const k=$('sec').getContext('2d'),m=15,c=C,K=c.K,T=c.T,tp=T*m,fl=c.fl,y0=110,x=K==='tee'?150:K==='lap'?170:160;
 const p=Math.min(c.p,T*1.4),w=Math.min(c.w,19),h=Math.min(c.h,4.6),z=Math.min(c.z,K==='lap'?T:9),zm=z*m,FZ='#dcd6c8',DK='#10141a',s2=K==='tee'?1:-1;
 k.clearRect(0,0,320,280);k.fillStyle='#4a525d';
 if(K==='butt'){k.fillRect(0,y0,x-15,tp);k.fillRect(x+15,y0,305-x,tp)}else k.fillRect(0,y0,320,tp);
 if(K==='tee')k.fillRect(x-tp,y0-100,tp,100);
 if(K==='lap')k.fillRect(x,y0-tp,320-x,tp);
 const cx0=K==='tee'?x+zm*.3:K==='lap'?x-zm*.3:x,rx=fl?zm*.55:w/2*m*.95,tx0=x+s2*zm;
 k.save();k.beginPath();k.rect(0,y0,320,tp);k.clip();
 k.fillStyle='rgba(224,160,90,.3)';k.beginPath();k.ellipse(cx0,y0,rx+2.5*m,(p+2.5)*m,0,0,Math.PI);k.fill();
 k.fillStyle=FZ;k.beginPath();k.ellipse(cx0,y0,rx,p*m,0,0,Math.PI);k.fill();
 if(K==='butt')k.fillRect(x-15,y0,30,Math.min(p*m,tp));
 k.restore();
 k.fillStyle=FZ;k.beginPath();
 if(fl){k.moveTo(x,y0);k.lineTo(tx0,y0);k.quadraticCurveTo(x+s2*.65*zm,y0-.65*zm,x,y0-zm)}else{k.moveTo(x-w/2*m,y0);k.quadraticCurveTo(x,y0-2*h*m,x+w/2*m,y0)}
 k.closePath();k.fill();k.fillStyle=DK;
 if(c.pr)for(let i=0;i<5;i++){k.beginPath();k.arc(fl?x+s2*zm*(.2+.1*i):x+(i-2)*w*m*.16,fl?y0-zm*(.15+.04*(i%2)):y0+(i%2?.35:.2)*p*m+4,2+i%3,0,7);k.fill()}
 if(c.uc){const q=(a,b,d,e,f2,g)=>{k.beginPath();k.moveTo(a,b);k.lineTo(d,e);k.lineTo(f2,g);k.fill()};
  if(fl){q(tx0,y0,tx0+s2*9,y0,tx0+s2*2,y0+8);q(x,y0-zm,x-s2*8,y0-zm,x-s2,y0-zm-8)}else for(const s of[-1,1])q(x+s*w/2*m,y0,x+s*(w/2*m+9),y0,x+s*(w/2*m+2),y0+8)}
 if(c.lf){k.strokeStyle=DK;k.lineWidth=2;k.beginPath();
  if(fl){k.moveTo(tx0,y0);k.lineTo(tx0-s2*zm*.4,y0+p*m*.9)}else for(const s of[-1,1]){k.moveTo(x+s*w/2*m,y0);k.lineTo(x+s*w/2*m*.85,y0+p*m*.9)}k.stroke()}
 if(c.bt){k.fillStyle='#0b0e12';k.fillRect(cx0-9,y0,18,tp)}
 k.fillStyle='#e9edf1';k.font='12px system-ui,sans-serif';const ty=y0+tp+22;
 k.fillText('Chapa de '+T+' mm · zona fundida (clara) e ZTA (alaranjada)',8,ty,304);
 k.fillText(fl?'Perna '+f(c.z)+' mm   Garganta '+f(c.z*.707)+' mm   P '+f(c.p)+' mm':'L '+f(c.w)+' mm   R '+f(c.h)+' mm   P '+f(c.p)+' mm',8,ty+17);
 if(c.bt){k.fillStyle='#f0645f';k.font='bold 14px system-ui,sans-serif';k.fillText('Perfuração',8,22)}}
const cv=$('sim'),cx=cv.getContext('2d'),X0=70,X1=830,SF=290,SC=6;
let run=false,tx=X0,bx=X0,beads=[],pt=[],t=0,lt=0,wp=0,balls=[],pores=[],holes=[],lh=X0;
function reset(){beads=[];pt=[];balls=[];pores=[];holes=[];lh=X0;tx=bx=X0;run=false;$('go').textContent='Soldar'}
$('go').onclick=()=>{if(tx>=X1)reset();run=!run;$('go').textContent=run?'Pausar':'Soldar'};
$('rs').onclick=reset;
$('id').onclick=()=>{Object.assign(S,{so:15,gas:15,ang:10},PC[S.pc].i);C=calc();S.v=Math.round((C.Vo+(S.g==='co2'?1:0))*2)/2;ui()};
function step(dt){t+=dt;wp+=S.wfs*8*dt;
 if(run){tx+=S.tr*SC*1.5*dt;
  while(bx<tx){const wob=1+.18*C.un*Math.sin(bx*.15+Math.sin(bx*.07)*3),w=Math.min(C.w*SC*wob,118),yb=C.fl?436+w/2:452;
  beads.push({x:bx,h:C.h*SC,w,b:t,uc:C.uc,lf:C.lf,ox:C.ox});
  if(Math.random()<C.pr)pores.push({x:bx,y2:yb+(Math.random()-.5)*w*.7,r:1+Math.random()*1.8,y:C.h*SC*(.5+.45*Math.random())});
  if(C.bt&&bx-lh>26){holes.push({x:bx,y2:yb,r:Math.max(6,w*.28)});lh=bx}
  bx+=2}
  if(tx>=X1){run=false;$('go').textContent='Soldar'}
  let n=(C.sp*70+4)*dt;while(n>0){if(Math.random()<n)pt.push({x:tx,y:SF-(1+(S.v-14)*.25)*SC,vx:(Math.random()-.3)*190,vy:-Math.random()*220-20,l:.7+Math.random()*.6,ball:Math.random()<cl(C.sp-.1,0,.8)});n--}
  if(C.bt&&Math.random()<dt*25)pt.push({x:tx+Math.random()*8-4,y:SF+C.T*SC-2,vx:0,vy:60,l:1.2,d:1})}
 pt=pt.filter(p=>{p.vy+=620*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.d)return p.y<372;if(p.y>SF){p.y=SF;p.vy*=-.3;p.vx*=.5;if(p.ball){p.ball=0;if(balls.length<400)balls.push({x:p.x,y2:(C.fl?436+C.w*SC/2:452)+(Math.random()*2-1)*(C.w*SC/2+22),r:1+Math.random()*2.2})}}p.l-=dt;return p.l>0});
 if(beads.length>500&&!run&&false)beads.shift()}
const col=(b,rp=1)=>{const q=cl(1-(t-b.b)/6,0,1),c0=b.ox?[78,66,56]:[95,100,108];return `rgb(${(c0[0]+(255-c0[0])*q)*rp|0},${(c0[1]+90*q*q)*rp|0},${(c0[2]-(c0[2]-38)*q)*rp|0})`};
function plan(){const YC=452,WF=436,fl=C.fl,K=C.K,Y0=b=>fl?WF:YC-b.w/2;
 let g=cx.createLinearGradient(0,392,0,512);g.addColorStop(0,'#58606b');g.addColorStop(1,'#3a414a');
 cx.fillStyle=g;cx.fillRect(40,392,820,120);
 if(K==='butt'){cx.fillStyle='#0b0e12';cx.fillRect(40,YC-6,820,12)}
 if(fl){cx.fillStyle='#7a828d';cx.fillRect(40,392,820,WF-392);cx.fillStyle='#9aa2ad';cx.fillRect(40,WF-3,820,3)}
